<style>
:root{--bg:#f6f6f4;--panel:#fff;--card:#fff;--line:#dcdcd6;--fg:#1c1c1a;--soft:#6f6f69;--edge:#a3a39b;--hid:#2563eb;--fi:#8a8a82;--fihot:#c2551f;--accent:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#151618;--panel:#1e2023;--card:#26282c;--line:#3c3f45;--fg:#e8e8e4;--soft:#98988f;--edge:#5b5e66;--hid:#7aa7ff;--fi:#7c7f86;--fihot:#e08a54;--accent:#7aa7ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:22px 20px 40px}
header h1{font-size:20px;margin:0 0 4px}
header .sub{color:var(--soft);font-size:12.5px;margin:0 0 14px}
#canvas{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow-x:auto}
#stage{position:relative;min-width:100%}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#grid{display:flex;gap:72px;padding:18px;align-items:flex-start;position:relative}
.cluster{flex:1 1 0;min-width:168px}
.cluster>h2{font-size:12.5px;letter-spacing:.06em;color:var(--soft);margin:2px 2px 10px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px}
.nodes{display:flex;flex-direction:column;gap:10px}
.node{position:relative;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px 7px;cursor:pointer;outline:none;transition:opacity .15s}
.node b{font-size:13.2px;font-weight:600}
.node .files{font-size:11px;color:var(--soft);margin-top:2px}
.node:hover,.node:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.node.pin{outline:2px solid var(--accent)}
.node.dim{opacity:.28}
.fi{position:absolute;top:-9px;right:-7px;font-size:10px;line-height:1;color:#fff;background:var(--fi);border-radius:9px;padding:2px 6px}
.fi.hot{background:var(--fihot)}
path.e{fill:none;stroke:var(--edge);stroke-width:1.4px}
path.e.dim{opacity:.1}
path.hid{fill:none;stroke:var(--hid);stroke-width:1.4px;stroke-dasharray:5 4;opacity:.9}
text.el{font-size:11px;fill:var(--soft);paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;font-weight:500}
text.cl{font-size:10px;fill:var(--hid);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.foot{color:var(--soft);font-size:12px;margin-top:10px}
@media(max-width:760px){#svg{display:none}#grid{flex-wrap:wrap}}
#tip{position:fixed;z-index:9;display:none;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
#tip b{font-size:13px}
#tip .tc{color:var(--soft);font-size:11px;margin-left:6px}
#tip p{margin:6px 0}
#tip .tf{color:var(--soft);font-size:11.5px;word-break:break-all}
#tip .ts{color:var(--accent);font-size:11.5px;margin-top:4px}
</style>
</head>

if(ca===cb){var s=anchor(a,'right',0.3),t=anchor(b,'left',0.3);return{pts:[[s[0],s[1]],[0,s[1]],[0,t[1]],[t[0],t[1]]],lane:-1,shoulder:ca,right:!!colX[ca+1]};}
if(Math.abs(ca-cb)===1&&sameRow){var s2t=A.x+A.w/2<=B.x+B.w/2;var s=anchor(a,s2t?'right':'left',0.5),t=anchor(b,s2t?'left':'right',0.5);var mx=(s[0]+t[0])/2;return{pts:[[s[0],s[1]],[mx,s[1]],[mx,t[1]],[t[0],t[1]]],lane:-1};}
var gi=Math.min(ca,cb),s2t2=A.x+A.w/2<=B.x+B.w/2;var ss=anchor(a,s2t2?'right':'left',0.5),tt=anchor(b,s2t2?'left':'right',0.5);return{pts:[[ss[0],ss[1]],[0,ss[1]],[0,tt[1]],[tt[0],tt[1]]],lane:gi};}
var callMap={};D.links.forEach(function(l){var a=M2N[l.src],b=M2N[l.dst];if(a&&b&&a!==b){var k=a+'>'+b;if(!callMap[k])callMap[k]=[];callMap[k]=callMap[k].concat(l.calls||[]);}});
function hasCJK(s){return /[\u4e00-\u9fff]/.test(s);}
function draw(){measure();svg.innerHTML='';placed=[];drawn={};
var vis=M.edges.filter(function(e){return !e.hidden;});
vis.forEach(function(e){drawn[e.from+'>'+e.to]=1;});
var defs=el('defs');defs.innerHTML='<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker><marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--hid)"/></marker>';svg.appendChild(defs);
var shells=vis.map(function(e){return{e:e,r:route(e.from,e.to)};});
var laneTot={},laneCnt={},shCnt={},shUsed={};shells.forEach(function(sh){if(!sh.r)return;if(sh.r.lane>=0)laneTot[sh.r.lane]=(laneTot[sh.r.lane]||0)+1;else if(sh.r.shoulder!=null)shCnt[sh.r.shoulder]=(shCnt[sh.r.shoulder]||0)+1;});
var showLabels=vis.length<=80;
shells.forEach(function(sh){if(!sh.r)return;var pts=sh.r.pts;if(sh.r.lane>=0){var gi=sh.r.lane;laneCnt[gi]=(laneCnt[gi]||0)+1;var k=laneCnt[gi]-1,tot=laneTot[gi];var off=Math.max(-4,Math.min(4,k-(tot-1)/2))*9;var lx=(colX[gi+1]?((colX[gi].max+colX[gi+1].min)/2):colX[gi].max)+off;pts[1][0]=lx;pts[2][0]=lx;}else if(sh.r.shoulder!=null){var c=sh.r.shoulder;var used=shUsed[c]=(shUsed[c]||0)+1;var lx=sh.r.right?(colX[c].max+12+used*7):(colX[c].min-12-used*7);pts[1][0]=lx;pts[2][0]=lx;}
var p=el('path',{d:rp(pts),'class':'e','marker-end':'url(#arr)'});p.dataset.f=sh.e.from;p.dataset.t=sh.e.to;svg.appendChild(p);
var raw=sh.e.desc||(callMap[sh.e.from+'>'+sh.e.to]||[]).slice(0,3).join(' · ');var txt=raw?(raw.length>34?raw.slice(0,33)+'…':raw):null;if(txt&&(showLabels||hasCJK(txt)))placeLabel(pts,txt);});
if(viewId)applyView(viewId);}
function segMids(pts){var mids=[];for(var i=1;i<pts.length;i++){var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1];mids.push({x:(pts[i][0]+pts[i-1][0])/2,y:(pts[i][1]+pts[i-1][1])/2,len:Math.hypot(dx,dy)});}mids.sort(function(a,b){return b.len-a.len;});return mids;}
function collides(x,y,w,h){for(var i=0;i<placed.length;i++){var r=placed[i];if(x<r.x+r.w&&x+w>r.x&&y<r.y+r.h&&y+h>r.y)return true;}return false;}
function placeLabel(pts,txt){var mids=segMids(pts).slice(0,3);var t=el('text',{'class':'el','text-anchor':'middle'});t.textContent=txt;svg.appendChild(t);var bb;try{bb=t.getBBox();}catch(err){t.remove();return;}
var w=bb.width+8,h=bb.height+4,nrects=[];for(var id in R)nrects.push(R[id]);
function test(cx,cy){var x=cx-w/2,y=cy-h/2;if(collides(x,y,w,h))return false;for(var i=0;i<nrects.length;i++){var r=nrects[i];if(x<r.x+r.w+6&&x+w>r.x-6&&y<r.y+r.h+6&&y+h>r.y-6)return false;}return true;}
var ok=null;for(var mi=0;mi<mids.length&&!ok;mi++){var m=mids[mi];var offs=[0,-14,14,-26,26,-38,38,-50,50];for(var oi=0;oi<offs.length;oi++){if(test(m.x,m.y+offs[oi])){ok=[m.x,m.y+offs[oi]];break;}}}
if(!ok){t.remove();return;}
t.setAttribute('x',ok[0]);t.setAttribute('y',ok[1]+4);placed.push({x:ok[0]-w/2,y:ok[1]-h/2,w:w,h:h});}
function borderPt(r,tx,ty){var cx=r.x+r.w/2,cy=r.y+r.h/2,dx=tx-cx,dy=ty-cy;var sx=dx?(r.w/2+5)/Math.abs(dx):1e9,sy=dy?(r.h/2+5)/Math.abs(dy):1e9;var s=Math.min(sx,sy);return[cx+dx*s,cy+dy*s];}
function clearHidden(){Array.prototype.slice.call(svg.querySelectorAll('.hid,.cl')).forEach(function(n){n.remove();});}
function showHidden(id){clearHidden();var pairs={};D.links.forEach(function(l){var a=M2N[l.src],b=M2N[l.dst];if(!a||!b||a===b)return;var host=(a===id)?a:((b===id)?b:null);if(host==null)return;var dep=(host===a)?b:a;if(drawn[host+'>'+dep]||drawn[dep+'>'+host])return;if(pairs[host+'>'+dep])return;pairs[host+'>'+dep]=1;var H=R[host],P=R[dep];if(!H||!P)return;var c1=[H.x+H.w/2,H.y+H.h/2],c2=[P.x+P.w/2,P.y+P.h/2];var p1=borderPt(H,c2[0],c2[1]),p2=borderPt(P,c1[0],c1[1]);
svg.appendChild(el('path',{d:'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' L'+p2[0].toFixed(1)+' '+p2[1].toFixed(1),'class':'hid','marker-end':'url(#arrh)'}));
var len=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);var cls=(l.calls||[]).slice(0,2);if(len>=150&&cls.length){var t=el('text',{'class':'cl','text-anchor':'middle',x:(p1[0]+p2[0])/2,y:(p1[1]+p2[1])/2-5});t.textContent=cls.join(' · ');svg.appendChild(t);}});}
function applyView(id){Array.prototype.forEach.call(svg.querySelectorAll('path.e'),function(p){var on=(p.dataset.f===id||p.dataset.t===id);p.classList.toggle('dim',!on);});Array.prototype.forEach.call(document.querySelectorAll('.node'),function(n){n.classList.toggle('dim',!!id&&n.dataset.node!==id);n.classList.toggle('pin',!!id&&n.dataset.node===id&&viewId===id);});showHidden(id);}
function clearView(){Array.prototype.forEach.call(svg.querySelectorAll('path.e'),function(p){p.classList.remove('dim');});Array.prototype.forEach.call(document.querySelectorAll('.node'),function(n){n.classList.remove('dim');n.classList.remove('pin');});clearHidden();}
M.nodes.forEach(function(n){var elm=n._el;
elm.addEventListener('mouseenter',function(){if(!viewId)applyView(n.id);showTip(n);});
elm.addEventListener('mousemove',function(ev){moveTip(ev);});
elm.addEventListener('mouseleave',function(){if(!viewId)clearView();tip.style.display='none';});
elm.addEventListener('click',function(ev){ev.stopPropagation();viewId=(viewId===n.id)?null:n.id;if(viewId)applyView(viewId);else clearView();});});
stage.addEventListener('click',function(){if(viewId){viewId=null;clearView();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&viewId){viewId=null;clearView();}});
function showTip(n){var c=byId[n.id];var cl=null;clusters.forEach(function(x){if(x.id===c.cluster)cl=x;});tip.innerHTML='<b></b><span class="tc"></span><p></p><div class="tf"></div><div class="ts"></div>';tip.querySelector('b').textContent=c.title;tip.querySelector('.tc').textContent=(cl&&cl.title)||c.cluster;tip.querySelector('p').textContent=c.resp||'（职责待 enrich：manifest resp 为空）';tip.querySelector('.tf').textContent='文件：'+c.files.join('、');tip.querySelector('.ts').textContent=(c.symbols&&c.symbols.length)?('符号：'+c.symbols.join(' · ')):'';tip.style.display='block';}
function moveTip(ev){var x=ev.clientX+16,y=ev.clientY+14;var r=tip.getBoundingClientRect();if(x+r.width>window.innerWidth-8)x=ev.clientX-r.width-10;if(y+r.height>window.innerHeight-8)y=ev.clientY-r.height-10;tip.style.left=x+'px';tip.style.top=y+'px';}
if(window.ResizeObserver){new ResizeObserver(function(){draw();}).observe(stage);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){draw();});
draw();
})();
