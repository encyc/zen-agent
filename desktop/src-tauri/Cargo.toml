[package]
name = "zenagent-desktop"
version = "0.8.1"
description = "ZenAgent desktop shell: drives `zen rpc` and mirrors the dsh interaction architecture"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[lib]
name = "zenagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zenagent-desktop"
path = "src/main.rs"
