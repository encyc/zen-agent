[project]
name = "zenagent-py"
version = "0.13.7"
description = "A minimal, Pythonic coding agent: streaming LLM client, async-generator agent loop, and terminal harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "llm", "ai", "cli", "async", "coding-agent"]
classifiers = [
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [
    { name = "Justin Gao", email = "atomyuangao@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
zen = "zenagent.cli.main:main"
zenagent = "zenagent.cli.main:main"

[project.optional-dependencies]
cli = [
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "textual>=8.2,<9",
]

[project.urls]
Homepage = "https://github.com/encyc/zen-agent"
Repository = "https://github.com/encyc/zen-agent"
Changelog = "https://github.com/encyc/zen-agent/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# The mypyc wheel segfaults on this repo's 3.15 interpreter (even `mypy
# --version`); build the pure-Python fallback instead.
no-binary-package = ["mypy"]

[tool.uv.build-backend]
module-root = ""
module-name = "zenagent"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-timeout>=2.3.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A hung gate future used to burn the CI job's whole window (audit P2).
timeout = 120
asyncio_default_fixture_loop_scope = "function"
# A test that calls an async helper without awaiting it still "passes"; the
# coroutine is only finalized later and pytest reports it as unraisable. Make
# that loud so the suite can never accumulate silently-skipped setup again.
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error:Exception ignored while finalizing coroutine:Warning",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Ratchet (audit P1-10): every module below is grandfathered with
# `ignore_errors` — the existing error debt stays frozen and CI fails only on
# NEW type errors in NON-overridden modules. Do not add modules to this list;
# fix the module and delete its override instead.

[[tool.mypy.overrides]]
# Ratchet baseline (audit P1-10): these 77 modules carry 691 existing
# type errors, frozen here so the gate fails only on NEW errors in modules
# NOT listed below. Do NOT add modules to this list — fix the module and
# delete its entry instead.
