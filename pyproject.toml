[project]
name = "zenagent-py"
version = "0.1.0"
description = "A minimal, Pythonic coding agent: streaming LLM client, async-generator agent loop, and terminal harness."
readme = "README.md"
keywords = ["agent", "llm", "ai", "cli", "async", "coding-agent"]
classifiers = [
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [
    { name = "Justin Gao", email = "atomyuangao@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
zen = "zenagent.cli.main:main"
zenagent = "zenagent.cli.main:main"

[project.optional-dependencies]
cli = [
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/encyc/zen-agent"
Repository = "https://github.com/encyc/zen-agent"
Changelog = "https://github.com/encyc/zen-agent/commits/main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "zenagent"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
